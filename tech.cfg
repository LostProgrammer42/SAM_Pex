# Dummy technology config (all lengths in um). Edit freely.
# LAYER  name   z_bottom  thickness  min_spacing  default_width
LAYER li1     0.00      0.10       0.17         0.17
LAYER met1    0.40      0.36       0.14         0.14

# Relative permittivity of the dielectric
EPS_R 3.9
# Multiplier on the sidewall (same-layer) coupling term, to crudely include fringing
FRINGE_FACTOR 1.0
# Max edge-to-edge spacing (um) considered for same-layer coupling
HALO 1.0

# Where same-layer sidewall coupling comes from: ANALYTIC (parallel-plate formula) or TABLE (captable below)
COUPLING_MODEL TABLE
# captable path, relative to this file's folder
CAPTABLE_FILE captable.cfg

# Dummy resistances.
# RSHEET layer ohm_per_square   (wire R = RSHEET * length / width)
RSHEET li1  12.5
RSHEET met1 0.125
# CUT_R cut_layer ohm_per_cut   (via R = CUT_R / number of cuts in the via)
CUT_R mcon 9.3
 
# Extra cuts on long wires: no resistor longer than this (um). 0 = only cut at ends/junctions.
MAX_SEG_LEN 0.1

# Merge fragmented same-net wires (stripes of one shape, end-to-end pieces, overlaps) into clean rectangles
# before anything is extracted. ON or OFF. Command line: --merge=on|off overrides this.
MERGE_FRAGMENTS ON